[project]
name = "dycp-memory-server"
version = "0.1.0"
description = "An MCP server implementing Dynamic Context Pruning (DYCP) with Semantic Decay, Ghost Graph, and Prefetching"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.0.0",
    "numpy>=1.24.0",
    "sentence-transformers>=2.2.0",
    "torch>=2.0.0",
    "pymilvus>=2.4.0",
    "spacy>=3.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[project.scripts]
dycp-server = "dycp_memory_server.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dycp_memory_server"]
