# Lethus Docker Compose for Coolify Deployment
# All ports managed by Coolify's Traefik proxy - no direct port exposure

x-common-env: &common-env
  LETHUS_POSTGRES_HOST: postgres
  LETHUS_POSTGRES_PORT: 5432
  LETHUS_POSTGRES_DB: lethus_db
  LETHUS_POSTGRES_USER: ${POSTGRES_USER:-postgres}
  LETHUS_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
  LETHUS_MILVUS_URI: http://milvus:19530

services:
  # ============ Infrastructure Services ============
  
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: lethus_db
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d lethus_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    restart: unless-stopped
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    restart: unless-stopped
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus:
    image: milvusdb/milvus:v2.4.15
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvus_data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy

  # ============ Application Services ============

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      <<: *common-env
      LETHUS_API_HOST: 0.0.0.0
      LETHUS_API_PORT: 8000
      LETHUS_CORS_ORIGINS: ${CORS_ORIGINS:-*}
      LETHUS_MILVUS_COLLECTION: ${MILVUS_COLLECTION:-lethus_memory}
      LETHUS_OPENAI_API_KEY: ${OPENAI_API_KEY}
      LETHUS_OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      LETHUS_OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      LETHUS_OPENAI_EMBEDDING_DIM: ${OPENAI_EMBEDDING_DIM:-1536}
      LETHUS_DYCP_TAU: ${DYCP_TAU:-0.6}
      LETHUS_DYCP_THETA: ${DYCP_THETA:-1.0}
      LETHUS_DECAY_LAMBDA: ${DECAY_LAMBDA:-0.98}
      LETHUS_USE_SPACY: ${USE_SPACY:-true}
      LETHUS_GHOST_GRAPH_BOOST: ${GHOST_GRAPH_BOOST:-1.5}
      LETHUS_GHOST_GRAPH_ADDITIVE_BOOST: ${GHOST_GRAPH_ADDITIVE_BOOST:-0.35}
      LETHUS_PREFETCH_ENABLED: ${PREFETCH_ENABLED:-true}
      LETHUS_PREFETCH_CACHE_SIZE: ${PREFETCH_CACHE_SIZE:-50}
      LETHUS_PREFETCH_TTL: ${PREFETCH_TTL:-60.0}
      LETHUS_MAX_CONTEXT_TOKENS: ${MAX_CONTEXT_TOKENS:-8000}
      LETHUS_IMPORTANCE_THRESHOLD: ${IMPORTANCE_THRESHOLD:-0.7}
      LETHUS_CONFIDENCE_THRESHOLD: ${CONFIDENCE_THRESHOLD:-0.3}
      LETHUS_LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LETHUS_LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.7}
      LETHUS_LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-1000}
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      milvus:
        condition: service_healthy
    labels:
      - "coolify.managed=true"
      - "coolify.type=application"
      - "coolify.port=8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://backend:8000}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://backend:8000}
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    depends_on:
      backend:
        condition: service_healthy
    labels:
      - "coolify.managed=true"
      - "coolify.type=application"
      - "coolify.port=3000"

volumes:
  postgres_data:
  etcd_data:
  minio_data:
  milvus_data:
