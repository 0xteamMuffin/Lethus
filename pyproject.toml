[project]
name = "lethus"
version = "0.1.0"
description = "Lethus - DYCP Context Reduction Proxy with Kadane's Algorithm, Semantic Decay, and Ghost Graph"
requires-python = ">=3.10"
dependencies = [
    # Core
    "numpy>=1.24.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    
    # Embeddings - OpenAI (default for production)
    "openai>=1.10.0",
    "tiktoken>=0.5.2",
    
    # Vector Storage
    "pymilvus>=2.4.0",
    
    # Entity Extraction (run: python -m spacy download en_core_web_sm)
    "spacy>=3.7.0",
    
    # HTTP Client (for proxy)
    "httpx>=0.26.0",
    
    # REST API
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.6",
    
    # Database
    "sqlalchemy>=2.0.25",
    "psycopg2-binary>=2.9.9",
]

[project.optional-dependencies]
local = [
    # For local embeddings (optional - use OpenAI instead)
    "sentence-transformers>=2.2.0",
    "torch>=2.0.0",
    "einops>=0.7.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.12.0",
    "ruff>=0.1.0",
]

[project.scripts]
lethus = "lethus.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lethus"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I"]
