[tool.poetry]
name = "memory-backend"
version = "0.1.0"
description = "DYCP Memory System Backend"
authors = ["Your Name <you@example.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.109.0"
uvicorn = {extras = ["standard"], version = "^0.27.0"}
pydantic = "^2.5.0"
pydantic-settings = "^2.1.0"
milvus = "^2.3.0"
psycopg2-binary = "^2.9.9"
sqlalchemy = "^2.0.25"
openai = "^1.10.0"
numpy = "^1.26.0"
scikit-learn = "^1.4.0"
python-dotenv = "^1.0.0"
python-multipart = "^0.0.6"
tiktoken = "^0.5.2"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
black = "^23.12.0"
ruff = "^0.1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
